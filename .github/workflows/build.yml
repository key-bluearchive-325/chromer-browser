name: Build and Release Chromer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk Chromer.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v2.0"
        name: "Chromer v2.0 (Full Edition)"
        body: |
          ### 🚀 Chromer v2.0 正式版
          - **Chrome同等機能**: マルチタブ（タブバッジ）、シークレットモード
          - **ツール**: ブックマーク、閲覧履歴、PC版サイト切り替え、ページ内検索
          - **メディア**: ファイルダウンロード、動画フルスクリーン再生、写真・書類アップロード
          - **プライバシー**: 高速広告・トラッカー遮断エンジン
          - **拡張機能**: 強制ダークモード、PiP強制、カスタムJavaScript
        draft: false
        prerelease: false
        files: Chromer.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}