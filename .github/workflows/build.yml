name: Build Chromer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Force Generate All Project Files
      run: |
        # 1. gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # 2. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Chromer"
        include(":app")
        EOF

        # 3. root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.4.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
        }
        EOF

        # 4. app/build.gradle.kts
        mkdir -p app
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "app.hatent.chromer"
            compileSdk = 34

            defaultConfig {
                applicationId = "app.hatent.chromer"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("androidx.activity:activity-ktx:1.9.0")
            implementation("com.google.android.material:material:1.12.0")
        }
        EOF

        # 5. AndroidManifest.xml
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="Chromer"
                android:supportsRtl="true"
                android:usesCleartextTraffic="true"
                android:hardwareAccelerated="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. activity_main.xml
        rm -rf app/src/main/res/layout
        mkdir -p app/src/main/res/layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#FFFFFF">
            <ProgressBar
                android:id="@+id/progressBar"
                style="?android:attr/progressBarStyleHorizontal"
                android:layout_width="match_parent"
                android:layout_height="2.5dp"
                android:visibility="gone" />
            <WebView
                android:id="@+id/webView"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1" />
            <LinearLayout
                android:id="@+id/bottomBar"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:paddingLeft="8dp"
                android:paddingRight="8dp"
                android:paddingTop="6dp"
                android:paddingBottom="6dp"
                android:background="#F8F8F8">
                <Button
                    android:id="@+id/btnBack"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:background="?android:attr/selectableItemBackgroundBorderless"
                    android:textSize="18sp"
                    android:text="‹" />
                <Button
                    android:id="@+id/btnForward"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:background="?android:attr/selectableItemBackgroundBorderless"
                    android:textSize="18sp"
                    android:text="›" />
                <EditText
                    android:id="@+id/etUrl"
                    android:layout_width="0dp"
                    android:layout_height="38dp"
                    android:layout_weight="1"
                    android:layout_marginLeft="6dp"
                    android:layout_marginRight="6dp"
                    android:hint="検索またはWebサイト名"
                    android:imeOptions="actionGo"
                    android:inputType="textUri"
                    android:paddingLeft="14dp"
                    android:paddingRight="14dp"
                    android:textSize="14sp"
                    android:maxLines="1" />
                <Button
                    android:id="@+id/btnExtensions"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:background="?android:attr/selectableItemBackgroundBorderless"
                    android:textSize="16sp"
                    android:text="🧩" />
                <Button
                    android:id="@+id/btnReload"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:background="?android:attr/selectableItemBackgroundBorderless"
                    android:textSize="16sp"
                    android:text="↻" />
            </LinearLayout>
        </LinearLayout>
        EOF

        # 7. Kotlinソースコードの自動生成
        rm -rf app/src/main/java
        mkdir -p app/src/main/java/app/hatent/chromer

        # AdBlocker.kt
        cat << 'EOF' > app/src/main/java/app/hatent/chromer/AdBlocker.kt
        package app.hatent.chromer
        import android.net.Uri
        import android.webkit.WebResourceResponse
        import java.io.ByteArrayInputStream

        object AdBlocker {
            private val BLOCK_DOMAINS = hashSetOf(
                "googleadservices.com", "googlesyndication.com", "doubleclick.net",
                "google-analytics.com", "googletagmanager.com", "adnxs.com",
                "criteo.com", "criteo.net", "outbrain.com", "taboola.com",
                "scorecardresearch.com", "rubiconproject.com", "pubmatic.com",
                "openx.net", "popads.net", "zedo.com", "adcolony.com",
                "unityads.unity3d.com", "amazon-adsystem.com", "connect.facebook.net",
                "ads-twitter.com", "analytics.twitter.com", "adroll.com"
            )
            fun isBlocked(url: String): Boolean {
                val host = Uri.parse(url).host?.lowercase() ?: return false
                return BLOCK_DOMAINS.any { host == it || host.endsWith(".$it") }
            }
            fun createEmptyResponse(): WebResourceResponse {
                return WebResourceResponse("text/plain", "UTF-8", ByteArrayInputStream(ByteArray(0)))
            }
        }
        EOF

        # ExtensionManager.kt
        cat << 'EOF' > app/src/main/java/app/hatent/chromer/ExtensionManager.kt
        package app.hatent.chromer
        import android.webkit.WebView

        object ExtensionManager {
            var isDarkModeEnabled = false
            var isPiPEnabled = true
            var customScripts = mutableListOf<String>()

            private const val DARK_MODE_SCRIPT = """
                (function() {
                    if (document.getElementById('chromer-dark-style')) return;
                    var style = document.createElement('style');
                    style.id = 'chromer-dark-style';
                    style.innerHTML = 'html { filter: invert(90%) hue-rotate(180deg) !important; background: #121212 !important; } img, video, canvas { filter: invert(100%) hue-rotate(180deg) !important; }';
                    document.head.appendChild(style);
                })();
            """

            private const val PIP_SCRIPT = """
                (function() {
                    var videos = document.querySelectorAll('video');
                    videos.forEach(function(video) {
                        video.removeAttribute('disablePictureInPicture');
                        video.setAttribute('playsinline', '');
                    });
                })();
            """

            fun applyExtensions(webView: WebView) {
                if (isDarkModeEnabled) {
                    webView.evaluateJavascript(DARK_MODE_SCRIPT, null)
                }
                if (isPiPEnabled) {
                    webView.evaluateJavascript(PIP_SCRIPT, null)
                }
                for (script in customScripts) {
                    webView.evaluateJavascript(script, null)
                }
            }
        }
        EOF

        # MainActivity.kt
        cat << 'EOF' > app/src/main/java/app/hatent/chromer/MainActivity.kt
        package app.hatent.chromer

        import android.graphics.Bitmap
        import android.graphics.Color
        import android.graphics.drawable.GradientDrawable
        import android.os.Bundle
        import android.view.View
        import android.view.inputmethod.EditorInfo
        import android.webkit.*
        import android.widget.*
        import androidx.activity.OnBackPressedCallback
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView
            private lateinit var etUrl: EditText
            private lateinit var progressBar: ProgressBar

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                webView = findViewById(R.id.webView)
                etUrl = findViewById(R.id.etUrl)
                progressBar = findViewById(R.id.progressBar)

                val btnBack = findViewById<Button>(R.id.btnBack)
                val btnForward = findViewById<Button>(R.id.btnForward)
                val btnExtensions = findViewById<Button>(R.id.btnExtensions)
                val btnReload = findViewById<Button>(R.id.btnReload)

                val pillDrawable = GradientDrawable().apply {
                    setColor(Color.parseColor("#EBEBEB"))
                    cornerRadius = 30f
                }
                etUrl.background = pillDrawable

                webView.settings.apply {
                    javaScriptEnabled = true
                    domStorageEnabled = true
                    databaseEnabled = true
                    offscreenPreRaster = true
                    cacheMode = WebSettings.LOAD_DEFAULT
                    setSupportZoom(true)
                    builtInZoomControls = true
                    displayZoomControls = false
                }

                webView.webViewClient = object : WebViewClient() {
                    override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                        val url = request?.url?.toString() ?: return null
                        if (AdBlocker.isBlocked(url)) {
                            return AdBlocker.createEmptyResponse()
                        }
                        return super.shouldInterceptRequest(view, request)
                    }

                    override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                        super.onPageStarted(view, url, favicon)
                        progressBar.visibility = View.VISIBLE
                        etUrl.setText(url)
                    }

                    override fun onPageFinished(view: WebView?, url: String?) {
                        super.onPageFinished(view, url)
                        progressBar.visibility = View.GONE
                        val hideAdCss = """
                            javascript:(function() {
                                var style = document.createElement('style');
                                style.innerHTML = 'ins.adsbygoogle, .ad-banner, .ad-container, [id^="google_ads"] { display: none !important; }';
                                document.head.appendChild(style);
                            })()
                        """.trimIndent()
                        view?.evaluateJavascript(hideAdCss, null)
                        view?.let { ExtensionManager.applyExtensions(it) }
                    }
                }

                webView.webChromeClient = object : WebChromeClient() {
                    override fun onProgressChanged(view: WebView?, newProgress: Int) {
                        super.onProgressChanged(view, newProgress)
                        progressBar.progress = newProgress
                    }
                }

                btnBack.setOnClickListener { if (webView.canGoBack()) webView.goBack() }
                btnForward.setOnClickListener { if (webView.canGoForward()) webView.goForward() }
                btnReload.setOnClickListener { webView.reload() }
                btnExtensions.setOnClickListener { showExtensionDialog() }

                etUrl.setOnEditorActionListener { _, actionId, _ ->
                    if (actionId == EditorInfo.IME_ACTION_GO) {
                        loadInputUrl()
                        true
                    } else {
                        false
                    }
                }

                onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                    override fun handleOnBackPressed() {
                        if (webView.canGoBack()) {
                            webView.goBack()
                        } else {
                            isEnabled = false
                            onBackPressedDispatcher.onBackPressed()
                        }
                    }
                })

                webView.loadUrl("https://duckduckgo.com")
            }

            private fun loadInputUrl() {
                val input = etUrl.text.toString().trim()
                if (input.isEmpty()) return
                val url = if (input.startsWith("http://") || input.startsWith("https://")) {
                    input
                } else if (input.contains(".") && !input.contains(" ")) {
                    "https://$input"
                } else {
                    "https://duckduckgo.com/?q=$input"
                }
                webView.loadUrl(url)
            }

            private fun showExtensionDialog() {
                val status = if (ExtensionManager.isDarkModeEnabled) "ON" else "OFF"
                val items = arrayOf(
                    "🌙 強制ダークモード: $status",
                    "📺 動画ピクチャーインピクチャー (PiP) サポート",
                    "＋ カスタムJavaScriptスクリプトを追加"
                )

                AlertDialog.Builder(this)
                    .setTitle("🧩 Chromer 拡張機能")
                    .setItems(items) { _, which ->
                        when (which) {
                            0 -> {
                                ExtensionManager.isDarkModeEnabled = !ExtensionManager.isDarkModeEnabled
                                webView.reload()
                                Toast.makeText(this, "ダークモードを切り替えました", Toast.LENGTH_SHORT).show()
                            }
                            1 -> {
                                ExtensionManager.isPiPEnabled = true
                                ExtensionManager.applyExtensions(webView)
                                Toast.makeText(this, "動画PiP機能を実行しました", Toast.LENGTH_SHORT).show()
                            }
                            2 -> {
                                showAddCustomScriptDialog()
                            }
                        }
                    }
                    .setNegativeButton("閉じる", null)
                    .show()
            }

            private fun showAddCustomScriptDialog() {
                val input = EditText(this).apply {
                    hint = "JavaScriptコードを入力"
                }
                AlertDialog.Builder(this)
                    .setTitle("カスタムスクリプト追加")
                    .setView(input)
                    .setPositiveButton("追加＆実行") { _, _ ->
                        val script = input.text.toString().trim()
                        if (script.isNotEmpty()) {
                            ExtensionManager.customScripts.add(script)
                            webView.evaluateJavascript(script, null)
                            Toast.makeText(this, "スクリプトを実行しました", Toast.LENGTH_SHORT).show()
                        }
                    }
                    .setNegativeButton("キャンセル", null)
                    .show()
            }
        }
        EOF

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Chromer-Debug-APK
        path: app/build/outputs/apk/debug/*.apk